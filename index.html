<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InvestCalc Mobile</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            background: #f4f6f8; 
            margin: 0;
            display: flex; 
            justify-content: center; 
            padding: 15px; 
        }
        .card { 
            background: white; 
            padding: 20px; 
            border-radius: 20px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.05); 
            width: 100%; 
            max-width: 450px; 
            box-sizing: border-box;
        }
        h2 { color: #1a237e; text-align: center; margin: 0 0 20px 0; font-size: 1.4rem; }
        
        .input-group { margin-bottom: 12px; flex: 1; }
        label { display: block; margin-bottom: 6px; font-size: 12px; color: #546e7a; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        
        input[type="number"] { 
            width: 100%; 
            padding: 14px; 
            border: 1px solid #dfe4e8; 
            border-radius: 12px; 
            box-sizing: border-box; 
            font-size: 16px; /* Предотвращает зум на iOS */
            background: #f9fbff;
            -webkit-appearance: none;
        }
        
        /* Адаптивная сетка */
        .row { display: flex; gap: 12px; margin-bottom: 5px; }
        
        @media (max-width: 400px) {
            .row { flex-direction: column; gap: 0; }
        }

        .checkbox-group { 
            display: flex; 
            align-items: center; 
            background: #edf2ff; 
            padding: 15px; 
            border-radius: 12px; 
            margin: 15px 0; 
            cursor: pointer;
            transition: 0.2s;
        }
        .checkbox-group:active { transform: scale(0.98); }
        .checkbox-group input { margin-right: 12px; width: 20px; height: 20px; }
        .checkbox-group span { font-size: 14px; color: #3949ab; font-weight: 500; }

        .result-panel { 
            margin-top: 15px; 
            padding: 18px; 
            border-radius: 15px; 
            background: #ffffff; 
            border: 2px solid #f0f2f5; 
        }
        .res-line { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px; color: #455a64; }
        .res-line span:last-child { font-weight: 600; color: #263238; }
        
        .total-val { 
            font-size: 26px; 
            font-weight: 800; 
            text-align: center; 
            margin-top: 10px; 
            color: #2e7d32; 
        }
        .loss-text { color: #d32f2f; }
        #percent { text-align: center; font-size: 14px; margin-top: 5px; font-weight: 600; }
    </style>
</head>
<body>

<div class="card">
    <h2>InvestCalc Pro 📈</h2>
    
    <div class="row">
        <div class="input-group">
            <label>Цена покупки</label>
            <input type="number" id="buyPrice" value="1323" step="any" oninput="calc()">
        </div>
        <div class="input-group">
            <label>Цена продажи</label>
            <input type="number" id="sellPrice" value="1428" step="any" oninput="calc()">
        </div>
    </div>
    
    <div class="row">
        <div class="input-group">
            <label>Кол-во (шт)</label>
            <input type="number" id="qty" value="11" oninput="calc()">
        </div>
        <div class="input-group">
            <label>Див. на акцию</label>
            <input type="number" id="divPerShare" value="47.23" step="any" oninput="calc()">
        </div>
    </div>

    <div class="input-group">
        <label>Комиссия брокера (%)</label>
        <input type="number" id="fee" value="0.06" step="0.01" oninput="calc()">
    </div>

    <label class="checkbox-group">
        <input type="checkbox" id="useTax" checked onchange="calc()">
        <span>Вычитать НДФЛ (13%)</span>
    </label>

    <div class="result-panel">
        <div class="res-line"><span>Дивиденды:</span> <span id="totalDivs">0 ₽</span></div>
        <div class="res-line"><span>Комиссии:</span> <span id="feeSum">0 ₽</span></div>
        <div class="total-val" id="finalProfit">0 ₽</div>
        <div id="percent">0%</div>
    </div>
</div>

<script>
function calc() {
    const buy = parseFloat(document.getElementById('buyPrice').value) || 0;
    const sell = parseFloat(document.getElementById('sellPrice').value) || 0;
    const qty = parseFloat(document.getElementById('qty').value) || 0;
    const div = parseFloat(document.getElementById('divPerShare').value) || 0;
    const feePct = (parseFloat(document.getElementById('fee').value) || 0) / 100;
    const isTax = document.getElementById('useTax').checked;

    const buyVol = buy * qty;
    const sellVol = sell * qty;
    const totalDivs = div * qty;
    const fees = (buyVol + sellVol) * feePct;
    
    // Считаем чистую прибыль
    let profit = (sellVol - buyVol) + totalDivs - fees;
    
    if (isTax && profit > 0) {
        profit = profit * 0.87;
    }

    const roi = buyVol > 0 ? (profit / buyVol) * 100 : 0;

    document.getElementById('totalDivs').innerText = totalDivs.toLocaleString() + ' ₽';
    document.getElementById('feeSum').innerText = fees.toFixed(2) + ' ₽';
    
    const profitEl = document.getElementById('finalProfit');
    profitEl.innerText = (profit >= 0 ? '+' : '') + profit.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2}) + ' ₽';
    profitEl.className = profit >= 0 ? 'total-val' : 'total-val loss-text';
    
    const percentEl = document.getElementById('percent');
    percentEl.innerText = `ROI: ${roi.toFixed(2)}%`;
    percentEl.style.color = profit >= 0 ? '#2e7d32' : '#d32f2f';
}
calc();
</script>

</body>
</html>
