<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Инвест-Калькулятор Live</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; display: flex; justify-content: center; padding: 20px; }
        .card { background: white; padding: 25px; border-radius: 16px; box-shadow: 0 8px 30px rgba(0,0,0,0.08); width: 100%; max-width: 420px; }
        h2 { color: #1a237e; text-align: center; margin-bottom: 20px; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 13px; color: #546e7a; font-weight: 600; }
        input[type="number"] { width: 100%; padding: 12px; border: 1px solid #ced4da; border-radius: 8px; box-sizing: border-box; font-size: 16px; transition: 0.2s; }
        input:focus { border-color: #3f51b5; outline: none; box-shadow: 0 0 0 3px rgba(63, 81, 181, 0.1); }
        .row { display: flex; gap: 12px; }
        .checkbox-group { display: flex; align-items: center; background: #f8f9fa; padding: 10px; border-radius: 8px; margin-top: 10px; cursor: pointer; }
        .checkbox-group input { margin-right: 10px; width: 18px; height: 18px; cursor: pointer; }
        .result-panel { margin-top: 20px; padding: 20px; border-radius: 12px; background: #ffffff; border: 1px solid #e0e0e0; }
        .res-line { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 15px; }
        .total-val { font-size: 22px; font-weight: bold; text-align: center; margin-top: 10px; color: #2e7d32; }
        .loss-text { color: #d32f2f; }
    </style>
</head>
<body>

<div class="card">
    <h2>Live Profit 📈</h2>
    
    <div class="row">
        <div class="input-group">
            <label>Цена покупки</label>
            <input type="number" id="buyPrice" value="1323" oninput="calc()">
        </div>
        <div class="input-group">
            <label>Цена продажи</label>
            <input type="number" id="sellPrice" value="1428" oninput="calc()">
        </div>
    </div>
    
    <div class="row">
        <div class="input-group">
            <label>Кол-во акций</label>
            <input type="number" id="qty" value="11" oninput="calc()">
        </div>
        <div class="input-group">
            <label>Див. на 1 акцию</label>
            <input type="number" id="divPerShare" value="47.23" oninput="calc()">
        </div>
    </div>

    <div class="input-group">
        <label>Комиссия брокера (%)</label>
        <input type="number" id="fee" value="0.06" step="0.01" oninput="calc()">
    </div>

    <label class="checkbox-group">
        <input type="checkbox" id="useTax" checked onchange="calc()">
        <span>Вычитать налог (13%)</span>
    </label>

    <div class="result-panel">
        <div class="res-line"><span>Сумма сделки:</span> <span id="totalSum">0 ₽</span></div>
        <div class="res-line"><span>Всего дивидендов:</span> <span id="totalDivs">0 ₽</span></div>
        <div class="res-line"><span>Комиссии:</span> <span id="feeSum">0 ₽</span></div>
        <div class="total-val" id="finalProfit">0 ₽</div>
        <div id="percent" style="text-align: center; font-size: 14px; color: #78909c;">0%</div>
    </div>
</div>

<script>
function calc() {
    // Получаем данные
    const buy = parseFloat(document.getElementById('buyPrice').value) || 0;
    const sell = parseFloat(document.getElementById('sellPrice').value) || 0;
    const qty = parseFloat(document.getElementById('qty').value) || 0;
    const div = parseFloat(document.getElementById('divPerShare').value) || 0;
    const feePct = (parseFloat(document.getElementById('fee').value) || 0) / 100;
    const isTax = document.getElementById('useTax').checked;

    const buyVol = buy * qty;
    const sellVol = sell * qty;
    const totalDivs = div * qty;
    
    // Считаем расходы
    const fees = (buyVol + sellVol) * feePct;
    
    // Грязная прибыль (Курсовая разница + Дивиденды - Комиссии)
    let profit = (sellVol - buyVol) + totalDivs - fees;
    
    // Налог (только с прибыли)
    if (isTax && profit > 0) {
        profit = profit * 0.87; // Вычитаем 13%
    }

    const roi = buyVol > 0 ? (profit / buyVol) * 100 : 0;

    // Вывод
    document.getElementById('totalSum').innerText = sellVol.toLocaleString() + ' ₽';
    document.getElementById('totalDivs').innerText = totalDivs.toLocaleString() + ' ₽';
    document.getElementById('feeSum').innerText = fees.toFixed(2) + ' ₽';
    
    const profitEl = document.getElementById('finalProfit');
    profitEl.innerText = (profit >= 0 ? '+' : '') + profit.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2}) + ' ₽';
    profitEl.className = profit >= 0 ? 'total-val' : 'total-val loss-text';
    
    document.getElementById('percent').innerText = `Доходность: ${roi.toFixed(2)}%`;
}

// Запускаем расчет при загрузке страницы
calc();
</script>

</body>
</html>
